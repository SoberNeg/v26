name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify source
        shell: pwsh
        run: |
          python -m py_compile LED_Screen_Designer_v20_27.py
          python -c "from PIL import Image; im=Image.open('assets/app.ico'); print('Icon:', im.size, im.format)"

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "LED_Screen_Designer_v20_27" `
            --icon "assets/app.ico" `
            --add-data "assets/app.ico;assets" `
            --collect-all tkinterdnd2 `
            --collect-all fitz `
            --collect-all paddleocr `
            --collect-all paddle `
            --hidden-import PIL._tkinter_finder `
            LED_Screen_Designer_v20_27.py

      - name: Verify build files
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LED_Screen_Designer_v20_27/LED_Screen_Designer_v20_27.exe")) { throw "EXE was not created" }
          Get-ChildItem "dist/LED_Screen_Designer_v20_27" | Select-Object Name,Length

      - name: Add troubleshooting launcher
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Starting LED Screen Designer v20.27...
          echo If the program reports an error, check:
          echo %%LOCALAPPDATA%%\LED_Screen_Designer\startup_error.log
          start "" "LED_Screen_Designer_v20_27.exe"
          pause
          '@ | Set-Content -Encoding ASCII "dist/LED_Screen_Designer_v20_27/RUN_WITH_DIAGNOSTICS.bat"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LED_Screen_Designer_v20_27_Windows
          path: dist/LED_Screen_Designer_v20_27/
          if-no-files-found: error
          compression-level: 6
